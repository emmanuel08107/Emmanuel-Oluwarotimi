<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="180" fill="#38bdf8"/>
  <circle cx="700" cy="70" r="40" fill="#fef08a"/>
  
  <!-- Running Track Border -->
  <rect y="180" width="800" height="320" fill="url(#trackGrad)"/>
  <!-- Track Running Lanes -->
  <g stroke="#ffffff" stroke-width="2" stroke-dasharray="15,15" opacity="0.8">
    <ellipse cx="400" cy="350" rx="370" ry="140" fill="none"/>
    <ellipse cx="400" cy="350" rx="340" ry="120" fill="none"/>
  </g>
  
  <!-- Football / Sports Grass Pitch Center -->
  <ellipse cx="400" cy="350" rx="300" ry="100" fill="url(#pitchGrad)" stroke="#ffffff" stroke-width="4"/>
  <!-- Center Line & Circle -->
  <line x1="400" y1="250" x2="400" y2="450" stroke="#ffffff" stroke-width="3"/>
  <ellipse cx="400" cy="350" rx="40" ry="25" fill="none" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Goal Posts Left & Right -->
  <rect x="130" y="325" width="20" height="50" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="650" y="325" width="20" height="50" fill="none" stroke="#ffffff" stroke-width="4"/>
  
  <!-- Soccer Ball -->
  <circle cx="370" cy="350" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <polygon points="370,344 374,348 372,354 368,354 366,348" fill="#0f172a"/>
  
  <!-- Banner -->
  <rect x="250" y="30" width="300" height="45" rx="22" fill="#0f172a" opacity="0.85"/>
  <text x="400" y="58" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">SPORTS &amp; ATHLETIC GROUNDS</text>
</svg>
