  <line x1="80" y1="130" x2="240" y2="130" stroke="#ffffff" stroke-width="3"/>
  
  <rect x="560" y="60" width="160" height="140" rx="8" fill="#bae6fd" stroke="#ffffff" stroke-width="4"/>
