<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#pgSky)"/>
  <circle cx="100" cy="80" r="45" fill="#facc15"/>
  <!-- Clouds -->
  <ellipse cx="280" cy="90" rx="60" ry="25" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="600" cy="110" rx="80" ry="30" fill="#ffffff" opacity="0.8"/>
  
  <rect y="300" width="800" height="200" fill="url(#grass)"/>
  <!-- Safety Rubber Mat area -->
  <rect x="80" y="320" width="640" height="150" rx="30" fill="#fed7aa" stroke="#fb923c" stroke-width="4"/>
  
  <!-- Swings Set -->
  <line x1="120" y1="380" x2="160" y2="150" stroke="#0284c7" stroke-width="8"/>
  <line x1="200" y1="380" x2="160" y2="150" stroke="#0284c7" stroke-width="8"/>
  <line x1="320" y1="380" x2="280" y2="150" stroke="#0284c7" stroke-width="8"/>
  <line x1="150" y1="150" x2="290" y2="150" stroke="#0284c7" stroke-width="10"/>
  <!-- Swing 1 -->
  <line x1="190" y1="150" x2="190" y2="290" stroke="#475569" stroke-width="3"/>
  <line x1="210" y1="150" x2="210" y2="290" stroke="#475569" stroke-width="3"/>
  <rect x="180" y="290" width="40" height="10" rx="3" fill="#e11d48"/>
  <!-- Swing 2 -->
  <line x1="240" y1="150" x2="240" y2="290" stroke="#475569" stroke-width="3"/>
  <line x1="260" y1="150" x2="260" y2="290" stroke="#475569" stroke-width="3"/>
  <rect x="230" y="290" width="40" height="10" rx="3" fill="#e11d48"/>
  
  <!-- Playhouse & Slide -->
  <!-- Tower -->
  <rect x="420" y="160" width="130" height="160" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="4"/>
  <!-- Roof -->
  <polygon points="400,160 485,90 570,160" fill="#e11d48"/>
  <!-- Windows -->
  <circle cx="485" cy="200" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Slide Tube / Ramp -->
  <path d="M540 230 C620 250 640 330 700 370" fill="none" stroke="#2563eb" stroke-width="30" stroke-linecap="round"/>
  <path d="M540 230 C620 250 640 330 700 370" fill="none" stroke="#60a5fa" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Safety Banner -->
  <rect x="240" y="20" width="320" height="42" rx="21" fill="#0f172a" opacity="0.85"/>
  <text x="400" y="47" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">SAFE &amp; SECURE PLAYGROUND</text>
</svg>
