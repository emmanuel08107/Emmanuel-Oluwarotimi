<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ictBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ictBg)"/>
  
  <!-- Cyber / Tech Circuits -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M50 100 L150 100 L200 150 L350 150"/>
    <circle cx="350" cy="150" r="4" fill="#38bdf8"/>
    <path d="M750 100 L650 100 L600 150 L450 150"/>
    <circle cx="450" cy="150" r="4" fill="#38bdf8"/>
  </g>
  
  <!-- Rows of Computer Workstations -->
  <!-- Back Row Desks -->
  <rect x="80" y="240" width="640" height="20" fill="#334155" rx="3"/>
  <!-- Back Row Monitors -->
  <rect x="120" y="180" width="70" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="230" y="180" width="70" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="340" y="180" width="70" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="490" y="180" width="70" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="600" y="180" width="70" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Front Row Desks -->
  <rect x="40" y="340" width="720" height="130" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" rx="6"/>
  <!-- Front Row Desktop Monitors (Big Glow) -->
  <g fill="#0f172a" stroke="#00f0ff" stroke-width="2.5">
    <rect x="80" y="280" width="90" height="60" rx="4"/>
    <rect x="230" y="280" width="90" height="60" rx="4"/>
    <rect x="380" y="280" width="90" height="60" rx="4"/>
    <rect x="530" y="280" width="90" height="60" rx="4"/>
  </g>
  <!-- Screen Codes & Graphics -->
  <text x="125" y="315" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">&lt;Python/&gt;</text>
  <text x="275" y="315" fill="#10b981" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">ROBOTICS</text>
  <text x="425" y="315" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">AI LAB</text>
  <text x="575" y="315" fill="#ec4899" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">CODING</text>
  
  <!-- Keyboards & Mice -->
  <rect x="85" y="350" width="80" height="18" rx="2" fill="#475569"/>
  <circle cx="180" cy="359" r="6" fill="#64748b"/>
  <rect x="235" y="350" width="80" height="18" rx="2" fill="#475569"/>
  <circle cx="330" cy="359" r="6" fill="#64748b"/>
  <rect x="385" y="350" width="80" height="18" rx="2" fill="#475569"/>
  <circle cx="480" cy="359" r="6" fill="#64748b"/>
  <rect x="535" y="350" width="80" height="18" rx="2" fill="#475569"/>
  <circle cx="630" cy="359" r="6" fill="#64748b"/>
  
  <!-- Banner -->
  <rect x="230" y="30" width="340" height="45" rx="22" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="58" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">DIGITAL ICT &amp; ROBOTICS SUITE</text>
</svg>
