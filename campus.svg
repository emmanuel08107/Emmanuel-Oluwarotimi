<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="60%" stop-color="#1e497b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="340" fill="url(#skyGrad)"/>
  <!-- Sun / Glow -->
  <circle cx="680" cy="90" r="50" fill="#fef08a" opacity="0.85"/>
  <circle cx="680" cy="90" r="70" fill="#fef08a" opacity="0.25"/>
  
  <!-- Campus Lawn -->
  <rect y="340" width="800" height="160" fill="url(#lawnGrad)"/>
  <!-- Driveway / Walkway -->
  <polygon points="340,340 460,340 540,500 260,500" fill="#cbd5e1"/>
  <line x1="400" y1="340" x2="400" y2="500" stroke="#f8fafc" stroke-width="4" stroke-dasharray="12,10"/>
  
  <!-- Trees -->
  <circle cx="100" cy="330" r="45" fill="#065f46"/>
  <circle cx="130" cy="315" r="50" fill="#047857"/>
  <circle cx="700" cy="330" r="45" fill="#065f46"/>
  <circle cx="670" cy="315" r="50" fill="#047857"/>
  
  <!-- Main School Building -->
  <!-- Left Wing -->
  <rect x="140" y="200" width="160" height="140" fill="#e2e8f0" rx="4"/>
  <polygon points="130,200 220,150 310,200" fill="url(#roofGrad)"/>
  <!-- Right Wing -->
  <rect x="500" y="200" width="160" height="140" fill="#e2e8f0" rx="4"/>
  <polygon points="490,200 580,150 670,200" fill="url(#roofGrad)"/>
  
  <!-- Center Main Hall -->
  <rect x="280" y="160" width="240" height="180" fill="url(#buildingGrad)" rx="6"/>
  <polygon points="265,160 400,100 535,160" fill="url(#roofGrad)"/>
  
  <!-- Clock Tower / Emblem Peak -->
  <rect x="370" y="70" width="60" height="40" fill="#ffffff" rx="4"/>
  <polygon points="360,70 400,35 440,70" fill="#b45309"/>
  <circle cx="400" cy="90" r="14" fill="#0a192f"/>
  <circle cx="400" cy="90" r="11" fill="#fbbf24"/>
  <line x1="400" y1="90" x2="400" y2="83" stroke="#0a192f" stroke-width="2"/>
  <line x1="400" y1="90" x2="406" y2="90" stroke="#0a192f" stroke-width="2"/>
  
  <!-- Windows -->
  <g fill="#38bdf8" opacity="0.9">
    <rect x="160" y="220" width="30" height="40" rx="2"/>
    <rect x="205" y="220" width="30" height="40" rx="2"/>
    <rect x="250" y="220" width="30" height="40" rx="2"/>
    <rect x="160" y="280" width="30" height="40" rx="2"/>
    <rect x="205" y="280" width="30" height="40" rx="2"/>
    <rect x="250" y="280" width="30" height="40" rx="2"/>
    
    <rect x="520" y="220" width="30" height="40" rx="2"/>
    <rect x="565" y="220" width="30" height="40" rx="2"/>
    <rect x="610" y="220" width="30" height="40" rx="2"/>
    <rect x="520" y="280" width="30" height="40" rx="2"/>
    <rect x="565" y="280" width="30" height="40" rx="2"/>
    <rect x="610" y="280" width="30" height="40" rx="2"/>
    
    <rect x="310" y="190" width="40" height="50" rx="2"/>
    <rect x="380" y="190" width="40" height="50" rx="2"/>
    <rect x="450" y="190" width="40" height="50" rx="2"/>
  </g>
  
  <!-- Main Entrance Pillars & Door -->
  <rect x="350" y="270" width="100" height="70" fill="#0f2b48" rx="4"/>
  <rect x="365" y="280" width="32" height="60" fill="#f59e0b"/>
  <rect x="403" y="280" width="32" height="60" fill="#f59e0b"/>
  <rect x="335" y="260" width="130" height="12" fill="#d97706" rx="2"/>
  
  <!-- Sign Banner -->
  <rect x="280" y="125" width="240" height="28" fill="#0a192f" rx="4"/>
  <text x="400" y="144" fill="#fbbf24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="1">WISDOM &amp; KNOWLEDGE SCHOOL</text>
  
  <!-- Flags -->
  <line x1="220" y1="150" x2="220" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <rect x="220" y="120" width="24" height="15" fill="#16a34a"/>
  <rect x="228" y="120" width="8" height="15" fill="#ffffff"/>
  
  <line x1="580" y1="150" x2="580" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="580,120 605,127 580,135" fill="#f59e0b"/>
</svg>
