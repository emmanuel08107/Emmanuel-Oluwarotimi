  <rect x="80" y="310" width="280" height="120" rx="8" fill="#ea580c"/>
  <rect x="70" y="300" width="300" height="18" rx="4" fill="#fb923c"/>
  <!-- Food Trays -->
  <rect x="110" y="285" width="50" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="125" cy="291" r="4" fill="#f59e0b"/>
  <circle cx="145" cy="291" r="4" fill="#16a34a"/>
  
  <rect x="220" y="285" width="50" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="235" cy="291" r="4" fill="#f59e0b"/>
  <circle cx="255" cy="291" r="4" fill="#16a34a"/>
  
  <!-- Right Table -->
  <rect x="440" y="310" width="280" height="120" rx="8" fill="#ea580c"/>
  <rect x="430" y="300" width="300" height="18" rx="4" fill="#fb923c"/>
  <!-- Food Trays -->
  <rect x="480" y="285" width="50" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="495" cy="291" r="4" fill="#f59e0b"/>
  <circle cx="515" cy="291" r="4" fill="#16a34a"/>
  
  <rect x="590" y="285" width="50" height="12" rx="2" fill="#e2e8f0"/>
  <circle cx="605" cy="291" r="4" fill="#f59e0b"/>
  <circle cx="625" cy="291" r="4" fill="#16a34a"/>
  
